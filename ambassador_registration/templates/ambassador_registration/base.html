{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}SPARC 2026 | Ambassador Application{% endblock %}</title>
    <link rel="icon" href="{% static '/img/logo.gif' %}" />
    <!--daisy ui-->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <!--tailwind-->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- sweet alert  -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!--particles.js-->
    <script src="{% static 'js/particles.min.js' %}"></script>
    <!-- form styling -->
    <link rel="stylesheet" href="{% static 'ambassador/css/form.css' %}" />
  </head>

  <body class="py-2 custom-scrollbar min-h-screen">
    <!--Particles JS Background-->
    <div id="particles-js" class="fixed inset-0 -z-10"></div>

    <!-- Top Banner Image -->
    <div class="w-11/12 md:w-3/5 mx-auto my-4">
      <div class="rounded overflow-hidden shadow-[0px_0px_10px_#00629B] border-1 border-white flex justify-center max-md:h-40">
        <img
          src="{% static 'ambassador/images/spac_phase1_banner.png' %}"
          alt="SPARC 2026 Ambassador Application"
          class="object-cover md:h-auto"
        />
      </div>
    </div>

    <!-- Main Content Area -->
    <main>
      {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <div class="flex justify-center items-center mt-3 h-15 mx-5 text-center sticky top-140">
      <p class="text-white font-semibold italic">
        <small>2026 © All rights reserved by IEEE NSU Student Branch</small>
      </p>
    </div>

    <!-- Particles.js Configuration matching Phase 1, Phase 2, and Hackathon forms -->
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        if (typeof particlesJS === "function" && document.getElementById("particles-js")) {
          particlesJS("particles-js", {
            particles: {
              number: { value: 80, density: { enable: true, value_area: 800 } },
              color: { value: "#ffffff" },
              shape: {
                type: "circle",
                stroke: { width: 0, color: "#000000" },
                polygon: { nb_sides: 5 },
                image: { src: "img/github.svg", width: 100, height: 100 },
              },
              opacity: {
                value: 1,
                random: true,
                anim: { enable: true, speed: 1, opacity_min: 0, sync: false },
              },
              size: {
                value: 3,
                random: true,
                anim: { enable: false, speed: 4, size_min: 0.3, sync: false },
              },
              line_linked: {
                enable: true,
                distance: 150,
                color: "#ffffff",
                opacity: 0.4,
                width: 1,
              },
              move: {
                enable: true,
                speed: 1,
                direction: "none",
                random: true,
                straight: false,
                out_mode: "out",
                bounce: false,
                attract: { enable: false, rotateX: 600, rotateY: 600 },
              },
            },
            interactivity: {
              detect_on: "canvas",
              events: {
                onhover: { enable: false, mode: "bubble" },
                onclick: { enable: false, mode: "repulse" },
                resize: true,
              },
              modes: {
                grab: { distance: 400, line_linked: { opacity: 1 } },
                bubble: {
                  distance: 250,
                  size: 0,
                  duration: 2,
                  opacity: 0,
                  speed: 3,
                },
                repulse: { distance: 400, duration: 0.4 },
                push: { particles_nb: 4 },
                remove: { particles_nb: 2 },
              },
            },
            retina_detect: true,
          });
        }
      });
    </script>
    <script src="{% static 'ambassador/js/form.js' %}" defer></script>
  </body>
</html>
